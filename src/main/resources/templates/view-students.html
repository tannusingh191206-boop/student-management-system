
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Students</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
        }

        .table-container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Student Records</h1>
        <p class="subtitle">View all registered students</p>
    </div>

    <div class="table-container">

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Course</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Address</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.rollNo}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.age}"></td>
                <td th:text="${student.gender}"></td>
                <td th:text="${student.course}"></td>
                <td th:text="${student.phone}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.address}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(students)}">
                <td colspan="9" class="empty">
                    No students found in the database.
                </td>
            </tr>

            </tbody>
        </table>

        <a href="/" class="back">Back to Home</a>

    </div>

</div>

</body>
</html>
