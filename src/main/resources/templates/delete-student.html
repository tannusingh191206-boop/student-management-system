
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            cursor: pointer;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #c9302c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Delete Student</h1>

    <p>Enter the Roll Number of the student you want to delete.</p>

    <form action="/delete" method="post">

        <label for="rollNo">Roll Number</label>

        <input
                type="text"
                id="rollNo"
                name="rollNo"
                placeholder="Enter Roll Number"
                required>

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this student?');">
            Delete Student
        </button>

    </form>

    <a class="back" href="/">Back to Home</a>

</div>

</body>
</html>
