
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Student</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            padding: 13px 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .result h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
        }

        .detail {
            padding: 9px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail strong {
            display: inline-block;
            width: 120px;
        }

        .not-found {
            margin-top: 25px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            background: #e2e8f0;
            color: #334155;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .back:hover {
            background: #cbd5e1;
        }

        @media (max-width: 600px) {
            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <h1>Search Student</h1>

        <p class="subtitle">
            Enter the student's roll number to find their record
        </p>

        <form action="/search-result" method="get">

            <input
                    type="text"
                    name="rollNo"
                    placeholder="Enter Roll Number"
                    required>

            <button type="submit">Search</button>

        </form>

        <div class="result" th:if="${student != null}">

            <h2>Student Details</h2>

            <div class="detail">
                <strong>Roll No:</strong>
                <span th:text="${student.rollNo}"></span>
            </div>

            <div class="detail">
                <strong>Name:</strong>
                <span th:text="${student.name}"></span>
            </div>

            <div class="detail">
                <strong>Age:</strong>
                <span th:text="${student.age}"></span>
            </div>

            <div class="detail">
                <strong>Gender:</strong>
                <span th:text="${student.gender}"></span>
            </div>

            <div class="detail">
                <strong>Course:</strong>
                <span th:text="${student.course}"></span>
            </div>

            <div class="detail">
                <strong>Phone:</strong>
                <span th:text="${student.phone}"></span>
            </div>

            <div class="detail">
                <strong>Email:</strong>
                <span th:text="${student.email}"></span>
            </div>

            <div class="detail">
                <strong>Address:</strong>
                <span th:text="${student.address}"></span>
            </div>

        </div>

        <div class="not-found" th:if="${notFound}">
            Student not found. Please check the roll number.
        </div>

        <a href="/" class="back">Back to Home</a>

    </div>

</div>

</body>
</html>
